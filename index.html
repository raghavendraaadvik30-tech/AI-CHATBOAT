<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aria · AI Avatar Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <!-- Three.js via import map (jsDelivr: reliable CORS + binary assets) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="bg-orbs">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <main class="app">
    <!-- ============ AVATAR STAGE ============ -->
    <section class="stage" aria-label="AI avatar">
      <div class="avatar-glow"></div>
      <div class="avatar-canvas" id="avatarCanvas" role="img" aria-label="Aria 3D avatar">
        <div class="avatar-loader" id="avatarLoader">
          <div class="spinner"></div>
          <span id="loaderText">Loading Aria…</span>
        </div>
      </div>

      <div class="cam-preview" id="camPreview" hidden>
        <video id="camera" autoplay playsinline muted></video>
        <span class="cam-badge"><span class="cam-dot"></span> live</span>
      </div>

      <div class="status-pill" id="statusPill">
        <span class="status-dot"></span>
        <span id="statusText">Online</span>
      </div>
      <h1 class="avatar-name">Aria</h1>
      <p class="avatar-tag">your friendly AI companion</p>
    </section>

    <!-- ============ CHAT PANEL ============ -->
    <section class="chat" aria-label="Chat">
      <header class="chat-head">
        <div class="chat-head-title">Chat with Aria</div>
        <div class="chat-head-actions">
          <button id="callBtn" class="icon-btn" title="Start live voice conversation" aria-label="Start live conversation">📞</button>
          <button id="stopBtn" class="icon-btn stop-btn" title="Stop response" aria-label="Stop response" hidden>■</button>
          <button id="cameraBtn" class="icon-btn" title="Let Aria see you (camera)" aria-label="Toggle camera">📷</button>
          <button id="voiceBtn" class="icon-btn" title="Toggle voice" aria-label="Toggle voice">🔊</button>
          <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Settings">⚙</button>
        </div>
      </header>

      <div class="messages" id="messages" aria-live="polite">
        <div class="empty-hint" id="emptyHint">Add your API key in ⚙, then chat with Aria — type, talk (🎤), or show her your camera (📷).</div>
      </div>

      <div class="typing" id="typing" hidden>
        <span></span><span></span><span></span>
      </div>

      <form class="composer" id="composer">
        <button type="button" class="mic-btn" id="micBtn" title="Speak to Aria" aria-label="Voice command">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2z"/></svg>
        </button>
        <input
          id="input"
          class="composer-input"
          type="text"
          placeholder="Say something to Aria…"
          autocomplete="off"
        />
        <button type="submit" class="send-btn" id="sendBtn" aria-label="Send">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 11l18-8-8 18-2-7-8-3z"/></svg>
        </button>
      </form>
    </section>
  </main>

  <!-- ============ SETTINGS MODAL ============ -->
  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal">
      <h2>Settings</h2>
      <label class="field">
        <span>OpenRouter API key</span>
        <input id="apiKey" type="password" placeholder="sk-or-v1-…" />
        <small>Stored only in this browser (localStorage). Never sent anywhere except OpenRouter.</small>
      </label>
      <label class="field">
        <span>Model</span>
        <input id="model" type="text" placeholder="openai/gpt-4o-mini" />
      </label>
      <label class="field">
        <span>Conversation language</span>
        <select id="languageSelect">
          <option value="en-IN">English (India)</option>
          <option value="kn-IN">ಕನ್ನಡ (Kannada)</option>
        </select>
        <small>Controls microphone recognition, AI reply language, voice, and lip shapes.</small>
      </label>
      <label class="field">
        <span>Voice</span>
        <select id="voiceSelect">
          <option value="">Automatic for selected language</option>
        </select>
        <small>Kannada speech requires a Kannada voice installed in your browser or operating system.</small>
      </label>
      <label class="field">
        <span>Personality (system prompt)</span>
        <textarea id="persona" rows="3"></textarea>
      </label>
      <div class="modal-actions">
        <button class="btn-ghost" id="closeModal">Cancel</button>
        <button class="btn-primary" id="saveSettings">Save</button>
      </div>
    </div>
  </div>

  <!-- transient notifications (not chat messages) -->
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <!-- 3D avatar engine, followed by app coordinator -->
  <script type="module" src="avatar3d.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
